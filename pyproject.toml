[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bwlab-segmentation"
version = "0.1.0"
description = "Controlled contour fragmentation and fence occlusion for SAM3 research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pillow>=10.1", "opencv-python", "matplotlib", "torch", "torchvision"]

[project.optional-dependencies]
coco = ["pycocotools"]
cluster = ["submitit"]
training = ["pycocotools", "wandb", "psutil"]
dev = ["ruff"]

[tool.setuptools.packages.find]
include = ["core*", "experiments*"]

[tool.setuptools.package-data]
"experiments.sam3_fragmentation" = ["configs/*.json", "README.md"]
"experiments.sam3_point_finetuning" = ["README.md"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/fixtures/contour_reference.py", ".references", ".worktrees"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
